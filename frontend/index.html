<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge TTS Studio</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-microphone-alt"></i>
                <h1>Edge TTS Studio</h1>
            </div>
            <div class="header-actions">
                <button id="themeToggle" class="btn-icon" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="historyBtn" class="btn-icon" title="Audio History">
                    <i class="fas fa-history"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Text Input Section -->
            <section class="card text-section">
                <div class="card-header">
                    <h2><i class="fas fa-keyboard"></i> Enter Your Text</h2>
                    <div class="text-stats">
                        <span id="wordCount">Words: 0</span>
                        <span id="charCount">Characters: 0</span>
                    </div>
                </div>
                <div class="card-body">
                    <textarea
                        id="textInput"
                        placeholder="Paste your story, script, or any text here..."
                        rows="8"
                    ></textarea>
                    <div class="chunk-info" id="chunkInfo" style="display: none;">
                        <i class="fas fa-info-circle"></i>
                        <span id="chunkText">Text will be processed in 1 chunk</span>
                    </div>
                </div>
            </section>

            <!-- Voice Settings Section -->
            <section class="card settings-section">
                <div class="card-header">
                    <h2><i class="fas fa-sliders-h"></i> Voice Settings</h2>
                </div>
                <div class="card-body">
                    <div class="settings-grid">
                        <!-- Language Filter -->
                        <div class="form-group">
                            <label for="languageSelect">
                                <i class="fas fa-globe"></i> Language
                            </label>
                            <select id="languageSelect">
                                <option value="">All Languages</option>
                            </select>
                        </div>

                        <!-- Voice Selection -->
                        <div class="form-group">
                            <label for="voiceSelect">
                                <i class="fas fa-user-circle"></i> Voice
                            </label>
                            <select id="voiceSelect">
                                <option value="">Loading voices...</option>
                            </select>
                        </div>

                        <!-- Gender Filter -->
                        <div class="form-group">
                            <label for="genderSelect">
                                <i class="fas fa-venus-mars"></i> Gender
                            </label>
                            <select id="genderSelect">
                                <option value="">All</option>
                                <option value="Female">Female</option>
                                <option value="Male">Male</option>
                            </select>
                        </div>

                        <!-- Output Format -->
                        <div class="form-group">
                            <label for="formatSelect">
                                <i class="fas fa-file-audio"></i> Format
                            </label>
                            <select id="formatSelect">
                                <option value="mp3">MP3</option>
                                <option value="wav">WAV</option>
                            </select>
                        </div>
                    </div>

                    <!-- Sliders -->
                    <div class="sliders-section">
                        <div class="slider-group">
                            <label>
                                <i class="fas fa-tachometer-alt"></i> Speed
                                <span id="rateValue" class="slider-value">0%</span>
                            </label>
                            <input type="range" id="rateSlider" min="-100" max="200" value="0" class="slider">
                        </div>

                        <div class="slider-group">
                            <label>
                                <i class="fas fa-music"></i> Pitch
                                <span id="pitchValue" class="slider-value">0Hz</span>
                            </label>
                            <input type="range" id="pitchSlider" min="-50" max="50" value="0" class="slider">
                        </div>

                        <div class="slider-group">
                            <label>
                                <i class="fas fa-volume-up"></i> Volume
                                <span id="volumeValue" class="slider-value">0%</span>
                            </label>
                            <input type="range" id="volumeSlider" min="-50" max="50" value="0" class="slider">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Generate Button -->
            <div class="generate-section">
                <button id="generateBtn" class="btn-generate">
                    <i class="fas fa-play"></i>
                    <span>Generate Speech</span>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText">Generating audio...</p>
            </div>

            <!-- Audio Player Section -->
            <section class="card player-section" id="playerSection" style="display: none;">
                <div class="card-header">
                    <h2><i class="fas fa-headphones"></i> Generated Audio</h2>
                </div>
                <div class="card-body">
                    <audio id="audioPlayer" controls class="audio-player"></audio>
                    <div class="player-actions">
                        <button id="downloadBtn" class="btn-download">
                            <i class="fas fa-download"></i> Download MP3
                        </button>
                    </div>
                </div>
            </section>

            <!-- History Section -->
            <section class="card history-section" id="historySection" style="display: none;">
                <div class="card-header">
                    <h2><i class="fas fa-history"></i> Audio History</h2>
                    <button id="refreshHistory" class="btn-icon-small">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="card-body">
                    <div id="historyList" class="history-list">
                        <p class="empty-state">No audio files generated yet.</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>Built with <i class="fas fa-heart" style="color: #e74c3c;"></i> using Microsoft Edge TTS</p>
        </footer>
    </div>

    <script src="/js/voices.js"></script>
    <script src="/js/tts.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
